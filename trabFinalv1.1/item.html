<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Aromas e Produtos</title>
    <link rel="stylesheet" href="itemStyle.css">
    <!--icones-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!--   Menu  de  navegação   -->
    <header class="row navbar">
        <ul>
            <li><img src="IMGS/logo.webp" alt="Logo" class="logo"></li>
            <li class="item"><a href="index.html">Aromas</a></li>
            <li class="item"><a href="index.html">Ambientes</a></li>
            <li class="item"><a href="index.html">Para Casa</a></li>
            <li class="item"><a href="index.html">Difusores</a></li>
            <li class="item"><a href="index.html"><i class="fi fi-sr-select"></i></a></li>
            <li class="item">
                <a href="carrinho.html">
                    <i class="fi fi-rr-shopping-cart sacola-icon"></i>
                </a>
            </li>
            <li class="item">
                <a href="adm.html">
                    <i class="fi fi-rr-settings"></i>
                </a>
            </li>
        </ul>
    </header>

    <div class="container container-custom">
        <div class="row">
            <!-- Miniaturas -->
            <div class="col-md-1 mt-4 ms-4">
                <img src="IMGS/conjVolumeBranco.jfif" class="img-thumbnail" alt="Thumb 1">
                <img src="IMGS/conjVolumeBranco.jfif" class="img-thumbnail" alt="Thumb 2">
                <img src="IMGS/conjVolumeBranco.jfif" class="img-thumbnail" alt="Thumb 3">
                <img src="IMGS/conjVolumeBranco.jfif" class="img-thumbnail" alt="Thumb 4">
            </div>

            <!-- Imagem principal -->
            <div class="col-md-5 m-4 ms-5">
                <img id="imgPrincipal" src="IMGS/conjVolumeBranco.jfif" class="img-fluid" alt="Imagem Principal">
            </div>

            <!-- Informações do produto -->
            <div class="col-md-4 m-4 ms-5 product-info">
                <h2 id="tituloItem"></h2>
                <p id="precoItem" class="price"></p> 
                <p id="descricaoItem"></p>
                <div id="estoqueItem">Estoque: Verificando...</div>
                <button id="botaoCompra" class="btn btn-custom botaoCompra">Compre Agora</button>
                <button class="btn btn-secondary mt-2 add-carrinho" >Adicionar ao Carrinho</button>
            </div>
        </div>

        <!-- Produtos Relacionados -->
        <div class="related-products">Produtos Relacionados</div>
        <div class="row mt-4 text-center">
            <div class="col-md-4">
                <img src="IMGS/conjComRefil.jfif" class="img-fluid" alt="Relacionado 1">
                <p>R$ 150,00</p>
            </div>
            <div class="col-md-4">
                <img src="IMGS/conjEscova+Sab.jfif" class="img-fluid" alt="Relacionado 2">
                <p>R$ 150,00</p>
            </div>
            <div class="col-md-4">
                <img src="IMGS/conjPinceisBeige.jfif" class="img-fluid" alt="Relacionado 3">
                <p>R$ 150,00</p>
            </div>
        </div>
    </div>

    <script src="item.js" defer></script>
</body>
</html>
