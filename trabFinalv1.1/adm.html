<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <title>Configurações</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Cadastro de Produtos</h1>
                <form action="cadastroItem.php" method="POST" enctype="multipart/form-data">
                <div class="mb-3 form-group">
                    <label for="titulo" class="form-label">Titulo</label>
                    <input type="text" class="form-control" name="tituloItem">
                </div>
                <div class="mb-3 form-group">
                    <label for="descricaoItem" class="form-label">Descrição</label>
                    <input type="text" class="form-control" name="descricaoItem">
                </div>
                <div class="mb-3 form-group">
                    <label for="imagemItem" class="form-label">Imagem</label>
                    <input type="file" class="form-control" name="imagemItem">
                </div>
                <div class="mb-3 form-group">
                    <label for="categoria" class="form-label">Categoria</label>
                    <input type="text" class="form-control" name="categoria">
                </div>
                <div class="mb-3 form-group">
                    <label for="precoItem" class="form-label">Preço</label>
                    <input type="number" class="form-control" name="precoItem">
                </div>
                <div class="mb-3 form-group">
                    <label for="qntdItem" class="form-label">Quantidade</label>
                    <input type="text" class="form-control" name="qntdItem">
                </div>
                <div class="form-group">
                    <input type="submit" class="btn btn-success">
                </div>
                </form>
            </div>
            
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
</html>
