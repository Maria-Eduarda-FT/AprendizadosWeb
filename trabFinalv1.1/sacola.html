<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<style>
.produtos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
}

.categoria {
    background-color: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 300px;
}

.produto-item img {
    width: 100%;
    border-radius: 8px;
}

.produto-item p {
    margin: 10px 0;
    font-size: 18px;
    color: #333;
}

.produto-item span {
    display: block;
    font-size: 16px;
    color: #e91e63;
    font-weight: bold;
}

.produto-item button {
    margin-top: 10px;
    padding: 10px 15px;
    border: none;
    background-color: #e91e63;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

.produto-item button:hover {
    background-color: #ff80ab;
}
    </style>

    <!-- Seção de produtos -->
    <section class="produtos">
        <div class="categoria" id="aromas">
            <h2>Aromas</h2>
            <div class="produto-item">
                <img src="aroma1.jpg" alt="Aroma 1">
                <p>Textura Solar Pérola</p>
                <span>R$ 500,00</span>
                <button>Compre Aqui</button>
            </div>
        </div>

        <div class="categoria" id="sabonetes">
            <h2>Sabonetes</h2>
            <div class="produto-item">
                <img src="sabonete1.jpg" alt="Sabonete 1">
                <p>Sabonete Luxo</p>
                <span>R$ 150,00</span>
                <button>Compre Aqui</button>
            </div>
        </div>
        
        <div class="categoria" id="bandejas">
            <h2>Bandejas</h2>
            <div class="produto-item">
                <img src="bandeja1.jpg" alt="Bandeja 1">
                <p>Bandeja de Luxo</p>
                <span>R$ 150,00</span>
                <button>Compre Aqui</button>
            </div>
        </div>
    </section>
</body>
</html>
